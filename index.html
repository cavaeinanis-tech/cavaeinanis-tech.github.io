<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cavae Inanis Labs</title>
<meta name="description" content="Independent apps made with care. No ads, no accounts, no data sold.">
<meta property="og:title" content="Cavae Inanis Labs">
<meta property="og:description" content="Independent apps made with care. No ads, no accounts, no data sold.">
<meta property="og:image" content="https://cavaeinanis-tech.github.io/developer-header.jpg">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 108 108'%3E%3Crect width='108' height='108' fill='%230A0806'/%3E%3Cpath d='M 54,27 L 77.383,67.5 L 30.617,67.5 Z' fill='none' stroke='%23C9A24A' stroke-width='4' stroke-linejoin='round'/%3E%3Ccircle cx='54' cy='54' r='7.695' fill='none' stroke='%23C9A24A' stroke-width='4'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0A0806;
    --fg: #ECE6DC;
    --muted: #9A9183;
    --rule: #2A2219;
    --gold: #C9A24A;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
    font-size: 17px;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 620px;
    margin: 0 auto;
    padding: 0 1.25rem 4rem;
    text-align: center;
  }
  .mark {
    display: block;
    width: 100%;
    max-width: 520px;
    height: auto;
    margin: 2.5rem auto 0;
  }
  h1 {
    font-size: 1.75rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 1.5rem 0 0.75rem;
  }
  .tagline {
    color: var(--muted);
    margin: 0 auto 2.5rem;
    max-width: 30rem;
  }
  .apps {
    border-top: 1px solid var(--rule);
    padding-top: 2.5rem;
  }
  .app-name {
    font-size: 1.15rem;
    font-weight: 600;
    margin: 0 0 0.35rem;
  }
  .app-blurb {
    color: var(--muted);
    font-size: 0.95rem;
    margin: 0 0 1.25rem;
  }
  .badge {
    display: inline-block;
    line-height: 0;
  }
  .badge img {
    height: 60px;
    width: auto;
  }
  footer {
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--rule);
    color: var(--muted);
    font-size: 0.9rem;
  }
  footer p { margin: 0.4rem 0; }
  a { color: var(--gold); }
  a:hover { color: #E0BC68; }
  @media (max-width: 480px) {
    h1 { font-size: 1.45rem; }
    .mark { margin-top: 1.5rem; }
    .badge img { height: 52px; }
  }
</style>
</head>
<body>
<main>
  <img class="mark" src="developer-header.jpg" alt="Cavae Inanis Labs">

  <h1>Cavae Inanis Labs</h1>
  <p class="tagline">Independent apps made with care. No ads, no accounts, no data sold.</p>

  <section class="apps">
    <p class="app-name">Goetic Companion</p>
    <p class="app-blurb">A careful, sourced reference and practice companion for the Lesser Key of Solomon.</p>
    <a class="badge"
       href="https://play.google.com/store/apps/details?id=com.cavaeinanis.goeticcompanion">
      <img alt="Get it on Google Play" src="google-play-badge.png" width="646" height="250">
    </a>
  </section>

  <footer>
    <p><a href="mailto:cavae.inanis@gmail.com">cavae.inanis@gmail.com</a></p>
    <p><a href="https://cavaeinanis-tech.github.io/goetic-companion-privacy/">Goetic Companion privacy policy</a></p>
  </footer>
</main>
</body>
</html>
